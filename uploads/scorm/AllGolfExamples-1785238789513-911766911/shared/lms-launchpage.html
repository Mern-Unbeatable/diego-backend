<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Course Launch Page</title>
    <link rel="stylesheet" href="style.css" type="text/css" />
    <script src="scormfunctions.js" type="text/javascript"></script>
    <style type="text/css">
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #ffffff;
      }
      #contentFrame {
        display: block;
        width: 100%;
        height: calc(100% - 48px);
        border: 0;
        background: #ffffff;
      }
      #navDiv {
        height: 48px;
        padding: 6px 8px;
        box-sizing: border-box;
        background: #1f2937;
      }
      #navDiv input[type="button"] {
        margin-right: 6px;
      }
    </style>
    <script type="text/javascript">
    var pageArray = new Array(15);

    pageArray[0] = "Playing/Playing.html";
    pageArray[1] = "Playing/Par.html";
    pageArray[2] = "Playing/Scoring.html";
    pageArray[3] = "Playing/OtherScoring.html";
    pageArray[4] = "Playing/RulesOfGolf.html";
    pageArray[5] = "Etiquette/Course.html";
    pageArray[6] = "Etiquette/Distracting.html";
    pageArray[7] = "Etiquette/Play.html";
    pageArray[8] = "Handicapping/Overview.html";
    pageArray[9] = "Handicapping/CalculatingHandicap.html";
    pageArray[10] = "Handicapping/CalculatingScore.html";
    pageArray[11] = "Handicapping/Example.html";
    pageArray[12] = "HavingFun/HowToHaveFun.html";
    pageArray[13] = "HavingFun/MakeFriends.html";
    pageArray[14] = "shared/assessmenttemplate.html?questions=Playing&questions=Etiquette&questions=Handicapping&questions=HavingFun";

    var currentPage = 0;
    var startTimeStamp = null;
    var processedUnload = false;
    var reachedEnd = false;
    var scormReady = false;

    function resolveStartPage(bookmark) {
      if (bookmark === null || bookmark === undefined || bookmark === "") {
        return 0;
      }

      var parsed = parseInt(bookmark, 10);
      if (isNaN(parsed) || parsed < 0 || parsed >= pageArray.length) {
        return 0;
      }

      return parsed;
    }

    function doStart(){
        startTimeStamp = new Date();

        if (typeof ScormProcessInitialize === "function") {
          ScormProcessInitialize();
          scormReady = true;
        }

        if (scormReady) {
          var completionStatus = ScormProcessGetValue("cmi.core.lesson_status");
          if (completionStatus == "not attempted"){
              ScormProcessSetValue("cmi.core.lesson_status", "incomplete");
          }

          var bookmark = ScormProcessGetValue("cmi.core.lesson_location");
          var resumePage = resolveStartPage(bookmark);

          if (resumePage > 0 && confirm("Would you like to resume from where you previously left off?")){
              currentPage = resumePage;
          } else {
              currentPage = 0;
          }
        } else {
          currentPage = 0;
        }

        goToPage();
    }

    function goToPage(){
        var theIframe = document.getElementById("contentFrame");
        var prevButton = document.getElementById("butPrevious");
        var nextButton = document.getElementById("butNext");
        var target = pageArray[currentPage];

        if (!target) {
          currentPage = 0;
          target = pageArray[0];
        }

        theIframe.src = "../" + target;

        if (currentPage == 0){
            nextButton.disabled = false;
            prevButton.disabled = true;
        }
        else if (currentPage == (pageArray.length - 1)){
            nextButton.disabled = true;
            prevButton.disabled = false;
        }
        else{
            nextButton.disabled = false;
            prevButton.disabled = false;
        }

        if (scormReady) {
          ScormProcessSetValue("cmi.core.lesson_location", String(currentPage));
        }

        if (currentPage == (pageArray.length - 1)){
            reachedEnd = true;
            if (scormReady) {
              ScormProcessSetValue("cmi.core.lesson_status", "completed");
            }
        }
    }

    function doUnload(pressedExit){
        if (processedUnload == true){return;}
        processedUnload = true;

        if (!scormReady || !startTimeStamp) { return; }

        var endTimeStamp = new Date();
        var totalMilliseconds = (endTimeStamp.getTime() - startTimeStamp.getTime());
        var scormTime = ConvertMilliSecondsToSCORMTime(totalMilliseconds, false);

        ScormProcessSetValue("cmi.core.session_time", scormTime);

        if (pressedExit == false && reachedEnd == false){
            ScormProcessSetValue("cmi.core.exit", "suspend");
        }

        ScormProcessFinish();
    }

    function doPrevious(){
        if (currentPage > 0){
            currentPage--;
        }
        goToPage();
    }

    function doNext(){
        if (currentPage < (pageArray.length - 1)){
            currentPage++;
        }
        goToPage();
    }

    function doExit(){
        if (reachedEnd == false && confirm("Would you like to save your progress to resume later?")){
            ScormProcessSetValue("cmi.core.exit", "suspend");
        }
        else{
            ScormProcessSetValue("cmi.core.exit", "");
        }

        doUnload(true);
    }

    function RecordTest(score){
        ScormProcessSetValue("cmi.core.score.raw", score);
        ScormProcessSetValue("cmi.core.score.min", "0");
        ScormProcessSetValue("cmi.core.score.max", "100");

        if (score >= 70){
            ScormProcessSetValue("cmi.core.lesson_status", "passed");
        }
        else{
            ScormProcessSetValue("cmi.core.lesson_status", "failed");
        }
    }

    function ConvertMilliSecondsToSCORMTime(intTotalMilliseconds, blnIncludeFraction){
        var intHours;
        var intMinutes;
        var intSeconds;
        var intMilliseconds;
        var intHundredths;
        var strCMITimeSpan;

        if (blnIncludeFraction == null || blnIncludeFraction == undefined){
            blnIncludeFraction = true;
        }

        intMilliseconds = intTotalMilliseconds % 1000;
        intSeconds = ((intTotalMilliseconds - intMilliseconds) / 1000) % 60;
        intMinutes = ((intTotalMilliseconds - intMilliseconds - (intSeconds * 1000)) / 60000) % 60;
        intHours = (intTotalMilliseconds - intMilliseconds - (intSeconds * 1000) - (intMinutes * 60000)) / 3600000;

        if (intHours == 10000) {
            intHours = 9999;
            intMinutes = (intTotalMilliseconds - (intHours * 3600000)) / 60000;
            if (intMinutes == 100) { intMinutes = 99; }
            intMinutes = Math.floor(intMinutes);
            intSeconds = (intTotalMilliseconds - (intHours * 3600000) - (intMinutes * 60000)) / 1000;
            if (intSeconds == 100) { intSeconds = 99; }
            intSeconds = Math.floor(intSeconds);
            intMilliseconds = (intTotalMilliseconds - (intHours * 3600000) - (intMinutes * 60000) - (intSeconds * 1000));
        }

        intHundredths = Math.floor(intMilliseconds / 10);
        strCMITimeSpan = ZeroPad(intHours, 4) + ":" + ZeroPad(intMinutes, 2) + ":" + ZeroPad(intSeconds, 2);

        if (blnIncludeFraction){
            strCMITimeSpan += "." + intHundredths;
        }

        if (intHours > 9999) {
            strCMITimeSpan = "9999:99:99";
            if (blnIncludeFraction){
                strCMITimeSpan += ".99";
            }
        }

        return strCMITimeSpan;
    }

    function ZeroPad(intNum, intNumDigits){
        var strTemp;
        var intLen;
        var i;

        strTemp = new String(intNum);
        intLen = strTemp.length;

        if (intLen > intNumDigits){
            strTemp = strTemp.substr(0,intNumDigits);
        }
        else{
            for (i=intLen; i<intNumDigits; i++){
                strTemp = "0" + strTemp;
            }
        }

        return strTemp;
    }
    </script>
</head>
<body onload="doStart();" onbeforeunload="doUnload(false);" onunload="doUnload();">
    <iframe width="100%" id="contentFrame" src=""></iframe>
    <div id="navDiv">
        <input type="button" value="<- Previous" id="butPrevious" onclick="doPrevious();"/>
        <input type="button" value="Next ->" id="butNext" onclick="doNext();"/>
        <input type="button" value="Exit" id="butExit" onclick="doExit();"/>
    </div>
</body>
</html>
